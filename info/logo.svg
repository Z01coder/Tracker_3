<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Логотип «Такт»">
  <!-- «Такт»: квадрат праймари с тремя колонками канбана (графит / белый / янтарь) -->
  <title>Такт — командный трекер задач</title>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1C3D5A"/>
  <!-- три колонки: разной высоты, как задачи на доске -->
  <rect x="13" y="15" width="10" height="20" rx="3" fill="#21262D"/>
  <rect x="27" y="15" width="10" height="32" rx="3" fill="#F6F8FA"/>
  <rect x="41" y="15" width="10" height="26" rx="3" fill="#C6973F"/>
  <!-- такт: точка-акцент под средней колонкой -->
  <circle cx="32" cy="51" r="2.5" fill="#C6973F"/>
</svg>
